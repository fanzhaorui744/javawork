<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#04060e">
    <title>校区地图 · 校园失物招领</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="nav" id="nav"></div>

<div class="container-wide">
    <div class="page-head">
        <div>
            <h1>校区地图</h1>
            <div class="sub">安徽大学磬苑校区 · 看清每件物品丢在哪里，让寻找不再盲目</div>
        </div>
        <div class="flex gap-8 flex-wrap">
            <button class="btn-gray btn-sm" id="btn-reset">${重置}</button>
            <button class="btn-sm" id="btn-publish">去发布</button>
        </div>
    </div>

    <div class="map-layout">
        <!-- ================= 左侧：地图主体 ================= -->
        <section class="map-main card">
            <div class="map-toolbar">
                <div class="map-legend" id="legend"></div>
                <div class="map-stats" id="map-stats"></div>
            </div>

            <div class="map-stage" id="map-stage">
                <img id="map-img" src="img/campus-map.jpg" alt="磬苑校区地图" draggable="false">
                <div class="map-layer" id="map-layer"></div>
                <div class="map-hint">滚轮缩放 · 拖拽平移 · 点击图钉查看物品</div>
                <div class="map-zoom">
                    <button id="z-in" title="放大">+</button>
                    <button id="z-out" title="缩小">−</button>
                    <button id="z-fit" title="复位">⤢</button>
                </div>
                <div class="map-tip" id="map-tip"></div>
            </div>
        </section>

        <!-- ================= 右侧：筛选与列表 ================= -->
        <aside class="map-side">
            <div class="card">
                <h2 class="card-title">
                    <span class="ico-chip" id="ico-filter"></span>筛选
                </h2>
                <div class="field">
                    <label>物品类型</label>
                    <div class="seg" id="seg-type">
                        <button data-v="" class="active">全部</button>
                        <button data-v="LOST">寻物</button>
                        <button data-v="FOUND">招领</button>
                    </div>
                </div>
                <div class="field">
                    <label>地点分类</label>
                    <div class="chip-wrap" id="chip-cat"></div>
                </div>
                <div class="field" style="margin-bottom:0">
                    <label for="f-place">指定建筑</label>
                    <select id="f-place"></select>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">
                    <span class="ico-chip" id="ico-list"></span>
                    <span id="list-title">地点分布</span>
                </h2>
                <div id="place-list"></div>
            </div>

            <div class="card" id="item-card" style="display:none">
                <h2 class="card-title">
                    <span class="ico-chip" id="ico-items"></span>
                    <span id="item-title">该地点物品</span>
                </h2>
                <div id="item-list"></div>
            </div>
        </aside>
    </div>
</div>

    <!-- GitHub Pages 静态部署：启用浏览器端离线引擎接管 /api/** -->
    <script>window.OFFLINE_MODE = true;</script>
    <script src="js/offline.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/campus-map.js"></script>
<script>
document.getElementById('ico-filter').innerHTML = ICON.tag;
document.getElementById('ico-list').innerHTML = ICON.pin;
document.getElementById('ico-items').innerHTML = ICON.inbox;
document.getElementById('btn-reset').innerHTML = ICON.refresh + ' 重置';

/* ================= 状态 ================= */
let ALL_ITEMS = [];
let FILTER = { type: '', cats: new Set(), place: '' };
let ZOOM = 1, TX = 0, TY = 0;
let SELECTED = null;

/* 物品归属地点：优先用物品自带的 mapX/mapY 反查最近地点，其次按地点名归一化 */
function placeOf(it) {
    const byName = CampusMap.normalizeLocation(it.location);
    if (byName) return byName;
    if (it.mapX != null && it.mapY != null) {
        const n = CampusMap.nearestPlaces(it.mapX, it.mapY, 1);
        return n.length ? n[0].place.id : null;
    }
    return null;
}

/* 物品在地图上的落点：有精确坐标就用精确坐标 */
function coordOf(it) {
    if (it.mapX != null && it.mapY != null) return { x: it.mapX, y: it.mapY };
    const p = CampusMap.byId(placeOf(it));
    return p ? { x: p.x, y: p.y } : null;
}

/* ================= 初始化图例 ================= */
document.getElementById('legend').innerHTML =
    Object.entries(CampusMap.CAT_COLOR).map(([cat, color]) =>
        `<span class="lg"><i style="background:${color}"></i>${cat}</span>`).join('');

/* ================= 分类 chip ================= */
document.getElementById('chip-cat').innerHTML =
    Object.entries(CampusMap.CAT_COLOR).map(([cat, color]) =>
        `<button class="chip" data-cat="${cat}" style="--c:${color}">${cat}</button>`).join('');

document.querySelectorAll('#chip-cat .chip').forEach(b => {
    b.onclick = () => {
        const c = b.dataset.cat;
        if (FILTER.cats.has(c)) { FILTER.cats.delete(c); b.classList.remove('on'); }
        else { FILTER.cats.add(c); b.classList.add('on'); }
        render();
    };
});

/* ================= 类型分段 ================= */
document.querySelectorAll('#seg-type button').forEach(b => {
    b.onclick = () => {
        document.querySelectorAll('#seg-type button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        FILTER.type = b.dataset.v;
        render();
    };
});

/* ================= 建筑下拉 ================= */
(function () {
    const sel = document.getElementById('f-place');
    const byCat = {};
    CampusMap.PLACES.forEach(p => {
        (byCat[p.cat] = byCat[p.cat] || []).push(p);
    });
    let html = '<option value="">全部建筑</option>';
    Object.keys(CampusMap.CAT_COLOR).forEach(cat => {
        if (!byCat[cat]) return;
        html += `<optgroup label="${cat}">`;
        byCat[cat].forEach(p => { html += `<option value="${p.id}">${p.id}</option>`; });
        html += '</optgroup>';
    });
    sel.innerHTML = html;
    sel.onchange = () => { FILTER.place = sel.value; render(); };
})();

/* ================= 数据 ================= */
async function loadData() {
    let page = 1, list = [], total = 0;
    try {
        do {
            const d = await api.get(`/api/items?page=${page}&size=100`);
            list = list.concat(d.list || []);
            total = d.total;
            page++;
        } while (list.length < total && page <= 10);
    } catch (e) {
        toast('加载失败：' + e.message, false);
        return;
    }
    ALL_ITEMS = list;
    render();
}

function visibleItems() {
    return ALL_ITEMS.filter(it => {
        if (FILTER.type && it.type !== FILTER.type) return false;
        const place = placeOf(it);
        const pObj = place ? CampusMap.byId(place) : null;
        if (FILTER.cats.size && (!pObj || !FILTER.cats.has(pObj.cat))) return false;
        if (FILTER.place && place !== FILTER.place) return false;
        return true;
    });
}

/* ================= 渲染地图 ================= */
function render() {
    const items = visibleItems();

    /* --- 按地点聚合 --- */
    const byPlace = {};
    items.forEach(it => {
        const p = placeOf(it);
        if (!p) return;
        (byPlace[p] = byPlace[p] || []).push(it);
    });

    /* --- 画图钉 --- */
    const layer = document.getElementById('map-layer');
    const max = Math.max(1, ...Object.values(byPlace).map(a => a.length));

    let html = '';
    /* 所有地点先画小圆点，有物品的叠加大图钉 */
    CampusMap.PLACES.forEach(p => {
        const n = (byPlace[p.id] || []).length;
        const color = CampusMap.CAT_COLOR[p.cat];
        if (FILTER.cats.size && !FILTER.cats.has(p.cat)) return;

        if (n === 0) {
            html += `<span class="mp-dot" style="left:${p.x}%;top:${p.y}%;--c:${color}"
                        title="${p.id}"></span>`;
        } else {
            /* 图钉大小随数量放大，最多 1.7 倍 */
            const scale = 1 + 0.7 * (n / max);
            const lost = (byPlace[p.id].filter(x => x.type === 'LOST')).length;
            const found = n - lost;
            html += `<button class="mp-pin${SELECTED === p.id ? ' sel' : ''}"
                        style="left:${p.x}%;top:${p.y}%;--c:${color};--s:${scale}"
                        data-place="${p.id}">
                        <span class="pin-body"><b>${n}</b></span>
                        <span class="pin-tip">
                            <b>${p.id}</b>
                            <i>${lost ? '寻物 ' + lost : ''}${lost && found ? ' · ' : ''}${found ? '招领 ' + found : ''}</i>
                        </span>
                     </button>`;
        }
    });
    layer.innerHTML = html;

    layer.querySelectorAll('.mp-pin').forEach(b => {
        b.onclick = e => {
            e.stopPropagation();
            SELECTED = b.dataset.place;
            render();
            renderItemList(SELECTED);
        };
    });

    /* --- 统计 --- */
    const lostN = items.filter(i => i.type === 'LOST').length;
    const foundN = items.filter(i => i.type === 'FOUND').length;
    document.getElementById('map-stats').innerHTML =
        `<span>共 <b>${items.length}</b> 件</span>
         <span class="l">寻物 <b>${lostN}</b></span>
         <span class="f">招领 <b>${foundN}</b></span>`;

    renderPlaceList(byPlace, items);

    if (SELECTED) renderItemList(SELECTED);
    else document.getElementById('item-card').style.display = 'none';
}

/* ================= 地点排行 ================= */
function renderPlaceList(byPlace, items) {
    const arr = Object.entries(byPlace)
        .map(([id, list]) => ({ id, n: list.length, cat: (CampusMap.byId(id) || {}).cat }))
        .sort((a, b) => b.n - a.n);

    document.getElementById('list-title').textContent =
        arr.length ? `地点分布（${arr.length} 处）` : '地点分布';

    if (!arr.length) {
        document.getElementById('place-list').innerHTML =
            emptyState('当前筛选下没有带位置信息的物品', 'pin');
        return;
    }

    const max = arr[0].n;
    document.getElementById('place-list').innerHTML = arr.map(a => `
        <button class="place-row" data-place="${a.id}">
            <span class="pr-name">
                <i style="background:${CampusMap.CAT_COLOR[a.cat] || '#666'}"></i>${esc(a.id)}
            </span>
            <span class="pr-bar"><i style="width:${Math.round(a.n / max * 100)}%"></i></span>
            <span class="pr-n">${a.n}</span>
        </button>`).join('');

    document.querySelectorAll('.place-row').forEach(b => {
        b.onclick = () => {
            SELECTED = b.dataset.place;
            render();
            renderItemList(SELECTED);
            /* 地图上滚动到该点 */
            const pin = document.querySelector(`.mp-pin[data-place="${SELECTED}"]`);
            if (pin) pin.scrollIntoView({ block: 'center', behavior: 'smooth' });
        };
    });
}

/* ================= 物品列表 ================= */
function renderItemList(placeId) {
    const p = CampusMap.byId(placeId);
    if (!p) return;
    const list = visibleItems().filter(it => placeOf(it) === placeId);

    const card = document.getElementById('item-card');
    card.style.display = '';

    const lost = list.filter(x => x.type === 'LOST').length;
    const found = list.length - lost;
    document.getElementById('item-title').innerHTML =
        `${esc(placeId)}
         <span class="badge badge-cyan" style="margin-left:8px;font-size:11.5px">${p.cat}</span>
         <span class="muted" style="font-size:12.5px;font-weight:500;margin-left:6px">
            寻物 ${lost} · 招领 ${found}
         </span>`;

    if (!list.length) {
        document.getElementById('item-list').innerHTML = emptyState('该地点暂无相关物品', 'inbox');
        return;
    }

    document.getElementById('item-list').innerHTML = list.map(it => `
        <a class="mini-item" href="item.html?id=${it.id}">
            <div class="mi-top">
                ${typeBadge(it.type)}
                ${statusBadge(it.status)}
            </div>
            <div class="mi-name">${esc(it.name)}</div>
            <div class="mi-meta">${ICON.clock} ${fmtTime(it.eventTime)}</div>
        </a>`).join('');
}

/* ================= 缩放 / 平移 ================= */
const stage = document.getElementById('map-stage');
const img = document.getElementById('map-img');
const layer = document.getElementById('map-layer');

function applyTransform() {
    const t = `translate(${TX}px, ${TY}px) scale(${ZOOM})`;
    img.style.transform = t;
    layer.style.transform = t;
}
function zoomAt(delta, cx, cy) {
    const old = ZOOM;
    ZOOM = Math.min(4, Math.max(1, ZOOM + delta));
    if (ZOOM === old) return;
    /* 以鼠标位置为锚点缩放 */
    const r = stage.getBoundingClientRect();
    const px = (cx ?? r.width / 2), py = (cy ?? r.height / 2);
    TX = px - (px - TX) * (ZOOM / old);
    TY = py - (py - TY) * (ZOOM / old);
    if (ZOOM === 1) { TX = 0; TY = 0; }
    applyTransform();
}

stage.addEventListener('wheel', e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(e.deltaY > 0 ? -0.25 : 0.25, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
stage.addEventListener('mousedown', e => {
    if (e.target.closest('.mp-pin')) return;
    dragging = true; sx = e.clientX; sy = e.clientY; ox = TX; oy = TY;
    stage.classList.add('grabbing');
});
window.addEventListener('mousemove', e => {
    if (!dragging) return;
    TX = ox + (e.clientX - sx);
    TY = oy + (e.clientY - sy);
    applyTransform();
});
window.addEventListener('mouseup', () => {
    dragging = false;
    stage.classList.remove('grabbing');
});

document.getElementById('z-in').onclick = () => zoomAt(0.35);
document.getElementById('z-out').onclick = () => zoomAt(-0.35);
document.getElementById('z-fit').onclick = () => { ZOOM = 1; TX = 0; TY = 0; applyTransform(); };
document.getElementById('btn-reset').onclick = () => {
    FILTER = { type: '', cats: new Set(), place: '' };
    SELECTED = null;
    document.querySelectorAll('#seg-type button').forEach(x =>
        x.classList.toggle('active', x.dataset.v === ''));
    document.querySelectorAll('#chip-cat .chip').forEach(x => x.classList.remove('on'));
    document.getElementById('f-place').value = '';
    ZOOM = 1; TX = 0; TY = 0; applyTransform();
    render();
};
document.getElementById('btn-publish').onclick = () => { location.href = 'publish.html'; };

/* ================= 启动 ================= */
(async () => {
    await loadUser();
    renderNav('map.html');
    await loadData();
})();
</script>

<style>

    display: flex;

    justify-content: space-between;

}
.map-legend .lg i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.map-stats { display: flex; gap: 15px; font-size: 13px; color: var(--text-dim); }
.map-stats b { color: var(--text); font-weight: 800; }
.map-stats .l b { color: #fb7185; }
.map-stats .f b { color: #22d3ee; }

/* ---------- 地图舞台 ---------- */
.map-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1700 / 1543;
    overflow: hidden;
    border-radius: var(--radius);
    border: 1px solid var(--border-strong);
    background: #06090f;
    cursor: grab;
    user-select: none;
}
.map-stage.grabbing { cursor: grabbing; }
.map-stage > img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    transform-origin: 0 0;
    pointer-events: none;
}
.map-layer {
    position: absolute; inset: 0;
    transform-origin: 0 0;
    pointer-events: none;
}

/* 无物品的地点小点 */
.mp-dot {
    position: absolute;
    width: 7px; height: 7px;
    margin: -3.5px 0 0 -3.5px;
    border-radius: 50%;
    background: var(--c);
    opacity: .42;
    box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .55);
}

/* 有物品的图钉 */
.mp-pin {
    position: absolute;
    transform: translate(-50%, -100%) scale(var(--s));
    transform-origin: bottom center;
    background: none; border: 0; padding: 0; box-shadow: none;
    pointer-events: auto;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.mp-pin:hover { filter: none; box-shadow: none; }
.mp-pin .pin-body {
    width: 30px; height: 30px;
    border-radius: 50% 50% 50% 4px;
    transform: rotate(-45deg);
    background: var(--c);
    border: 2px solid rgba(255, 255, 255, .92);
    box-shadow: 0 5px 16px -3px rgba(0, 0, 0, .85), 0 0 16px -4px var(--c);
    display: flex; align-items: center; justify-content: center;
}
.mp-pin .pin-body b {
    transform: rotate(45deg);
    color: #fff; font-size: 12.5px; font-weight: 800;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .55);
}
.mp-pin.sel .pin-body {
    border-color: #fff;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, .28), 0 5px 18px -3px rgba(0, 0, 0, .9);
}

/* 悬停气泡 */
.mp-pin .pin-tip {
    position: absolute;
    bottom: calc(100% + 7px);
    left: 50%;
    transform: translateX(-50%) scale(calc(1 / var(--s)));
    transform-origin: bottom center;
    background: rgba(8, 12, 22, .96);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    padding: 6px 10px;

    transition: opacity .14s var(--ease);

    box-shadow: 0 10px 26px -8px rgba(0, 0, 0, .9);
}
.mp-pin:hover .pin-tip { opacity: 1; }
.mp-pin .pin-tip b { display: block; font-size: 12.5px; color: var(--text); }
.mp-pin .pin-tip i { font-style: normal; font-size: 11px; color: var(--text-mute); }

.map-hint {
    position: absolute; left: 12px; bottom: 12px;
    font-size: 11.5px; color: rgba(200, 215, 240, .5);
    background: rgba(4, 6, 14, .72);
    padding: 5px 10px; border-radius: 8px;
    pointer-events: none;

.map-zoom {

}

/* ---------- 右侧 ---------- */

.map-side .card { margin-bottom: 0; }
.map-side .card-title { font-size: 15px; }

.seg {
    display: flex; gap: 4px;
    background: rgba(0, 0, 0, .3);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 3px;
}
.seg button {
    flex: 1; border: 0; background: none; box-shadow: none;
    padding: 7px 0; border-radius: 8px;
    font-size: 13px; font-weight: 700; color: var(--text-mute);
    cursor: pointer;
}

/* 地点排行 */

    width: 100%; display: grid;
    grid-template-columns: 1fr 62px 30px;

}
.place-row .pr-name i { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.place-row .pr-bar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .07); overflow: hidden; }
.place-row .pr-bar i { display: block; height: 100%; border-radius: 3px; background: var(--grad); }
